# Internal TCP load balancers for access from inside the VPC
# (e.g. GCE VMs, other GKE clusters). Postgres is not exposed publicly.
apiVersion: v1
kind: Service
metadata:
  name: ${PG_CLUSTER}-lb-rw
  namespace: ${NAMESPACE}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: ${PG_CLUSTER}
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ${PG_CLUSTER}-lb-ro
  namespace: ${NAMESPACE}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: ${PG_CLUSTER}
    cnpg.io/instanceRole: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
