# Backup target (GCS via Workload Identity) + daily scheduled base backup.
# WAL archiving is continuous, so point-in-time recovery is available
# between base backups.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${PG_CLUSTER}-gcs
  namespace: ${NAMESPACE}
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: gs://${GCS_BUCKET}/
    googleCredentials:
      gkeEnvironment: true
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${PG_CLUSTER}-daily
  namespace: ${NAMESPACE}
spec:
  # 6-field cron (seconds first): daily at 07:00 UTC, outside the GKE
  # maintenance window (02:00-06:00 UTC by default, config.sh) so a node
  # drain can't interrupt the base backup.
  schedule: "0 0 7 * * *"
  # Take the first base backup right away: until one exists, WAL alone
  # cannot be restored, so there would be no recovery point for up to 24h.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: ${PG_CLUSTER}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
